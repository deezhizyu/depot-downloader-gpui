name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: depot-downloader-gpui.exe
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            binary: depot-downloader-gpui
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: depot-downloader-gpui
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: depot-downloader-gpui

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libssl-dev \
            libvulkan1 \
            libglib2.0-dev \
            libzstd-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          archive="depot-downloader-gpui-${{ matrix.name }}.zip"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$archive" "${{ matrix.binary }}"
          else
            zip "../$archive" "${{ matrix.binary }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: depot-downloader-gpui-${{ matrix.name }}
          path: depot-downloader-gpui-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
